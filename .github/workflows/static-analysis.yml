name: static-analysis

# clang-tidy over a compile database, with only hard errors fatal.  Style and
# modernisation diagnostics are reported as annotations instead of failing the
# build, so this job catches broken code without bikeshedding.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: static-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build clang clang-tidy clang-tools

      - name: Configure a compile database (tests only)
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DLXX_BUILD_PLUGIN=OFF \
            -DLXX_BUILD_TESTS=ON

      - name: clang-tidy
        run: |
          set -euo pipefail
          python3 scripts/run_clang_tidy.py build/compile_commands.json

  cppcheck:
    name: cppcheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install cppcheck
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cppcheck

      - name: Run cppcheck
        run: |
          set -euo pipefail
          cppcheck \
            --enable=warning,portability,performance \
            --std=c++20 \
            --language=c++ \
            --inline-suppr \
            --force \
            --quiet \
            --xml --xml-version=2 \
            --suppress=missingIncludeSystem \
            --suppress=unusedFunction \
            -I src/dsp \
            -I src/plugin \
            src/dsp tests 2> cppcheck.xml || true
          ls -l cppcheck.xml
          python3 - <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse("cppcheck.xml").getroot()
          fatal, other = [], []
          for err in root.iter("error"):
              sev = err.get("severity", "")
              loc = next(iter(err.findall("location")), None)
              where = f"{loc.get('file0')}:{loc.get('line')}" if loc is not None else "?"
              item = (sev, where, err.get("msg", ""))
              if sev == "error":
                  fatal.append(item)
              else:
                  other.append(item)
          for sev, where, msg in other:
              print(f"note [{sev}] {where}: {msg}")
          print(f"cppcheck: {len(fatal)} error-severity, {len(other)} advisory")
          if fatal:
              for sev, where, msg in fatal:
                  print(f"FAIL [{sev}] {where}: {msg}", file=sys.stderr)
              sys.exit(1)
          PY
