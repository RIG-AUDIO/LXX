name: linux

# Required artifact: the LXX VST3, on every matrix entry.
# Required gates: unit tests, and an explicit prohibition on Standalone
# targets or Standalone artefacts anywhere in the build graph.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.compiler }} / ${{ matrix.build_type }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Debug, Release]
    env:
      CC: ${{ matrix.compiler == 'gcc' && 'gcc' || 'clang' }}
      CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            libasound2-dev libjack-jackd2-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev \
            libfreetype6-dev libfontconfig1-dev \
            libgl1-mesa-dev libglu1-mesa-dev \
            libcurl4-openssl-dev

      - name: Verify the toolchain
        run: |
          set -euo pipefail
          $CC --version
          $CXX --version
          cmake --version

      - name: Configure
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_C_COMPILER=$CC \
            -DCMAKE_CXX_COMPILER=$CXX \
            -DLXX_BUILD_TESTS=ON \
            -DLXX_BUILD_PLUGIN=ON \
            -DLXX_WARNINGS_AS_ERRORS=ON

      - name: Standalone prohibition (configured build graph)
        run: |
          set -euo pipefail
          # JUCE compiles every juce_audio_plugin_client_<Format>.cpp wrapper
          # into the plugin target (each file is guarded by
          # JucePlugin_Build_<Format>), so a file or object named
          # "*Standalone*" is NOT evidence of a Standalone build.  What must be
          # absent is a Standalone *product*: an enabled build define, a ninja
          # edge that produces a non-object output, or a non-object artefact.
          bad=0

          echo "-- JucePlugin_Build_* defines in the build graph --"
          defs="$(grep -o 'JucePlugin_Build_[A-Za-z0-9]*=[0-9]*' build/build.ninja \
                  | sort -u || true)"
          printf '%s\n' "$defs"
          if printf '%s\n' "$defs" | grep -E 'JucePlugin_Build_(Standalone|AU|AAX|VST2|LV2|Unity)=1' ; then
            echo "a prohibited plugin format is enabled in the build graph"
            bad=1
          fi

          echo "-- ninja edges producing a Standalone output --"
          edges="$(grep -E '^build ' build/build.ninja | grep -i 'standalone' \
                   | sed -E 's/^build ([^:]+):.*/\1/' \
                   | grep -viE '\.(o|obj|d|a|so)$' || true)"
          if [ -n "$edges" ]; then
            printf '%s\n' "$edges"
            echo "Standalone target present in the build graph"
            bad=1
          fi

          echo "-- non-object files under a Standalone path --"
          # build/_deps is the FetchContent source tree: JUCE ships its
          # Standalone *sources* there by design, so only build outputs count.
          artefacts="$(find build -ipath '*standalone*' -type f \
                       ! -ipath 'build/_deps/*' \
                       ! -name '*.o' ! -name '*.obj' ! -name '*.d' \
                       ! -name '*.a' -print -quit || true)"
          if [ -n "$artefacts" ]; then
            echo "$artefacts"
            echo "Standalone artefact present in the build tree"
            bad=1
          fi

          echo "-- evidence: Standalone mentions (wrapper objects are expected) --"
          grep -in 'standalone' build/build.ninja | sed -n '1,20p' || echo "(none)"

          if [ "$bad" -ne 0 ]; then
            echo "Standalone leaked into the configured build graph"; exit 1
          fi
          echo "ok: no Standalone target, define or artefact"

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        run: |
          set -euo pipefail
          ctest --test-dir build --output-on-failure --no-tests=error

      - name: Standalone prohibition (built artefacts)
        run: |
          set -euo pipefail
          # Same precision as the configured-graph gate: JUCE wrapper object
          # files are named *Standalone*.cpp.o and are expected to exist.
          if find build -ipath '*standalone*' -type f \
                 ! -ipath 'build/_deps/*' \
                 ! -name '*.o' ! -name '*.obj' ! -name '*.d' ! -name '*.a' \
                 -print -quit | grep -q .; then
            echo "Standalone artefact was built"; exit 1
          fi
          if find build -type d -ipath '*artefacts*standalone*' \
                 ! -ipath 'build/_deps/*' -print -quit | grep -q .; then
            echo "Standalone artefact directory produced"; exit 1
          fi
          if find build/src/plugin -name '*.app' -print -quit | grep -q .; then
            echo "application package produced"; exit 1
          fi
          echo "ok: plugin-only artefacts"

      - name: Require the VST3 artefact
        id: vst3
        run: |
          set -euo pipefail
          vst3="build/src/plugin/LXXPlugin_artefacts/${{ matrix.build_type }}/VST3/LXX.vst3"
          if [ ! -e "$vst3" ]; then
            echo "required VST3 artefact missing: $vst3"
            find build/src/plugin -maxdepth 5 -print | sed 's/^/  /' || true
            exit 1
          fi
          echo "path=$vst3" >> "$GITHUB_OUTPUT"
          echo "ok: $vst3"
          find "$vst3" -maxdepth 3 -type f -print | sed 's/^/  /'

      - name: Upload VST3 artefact
        uses: actions/upload-artifact@v4
        with:
          name: LXX-vst3-${{ matrix.compiler }}-${{ matrix.build_type }}
          path: ${{ steps.vst3.outputs.path }}
          if-no-files-found: error
          retention-days: 14

      # Full stdout of every test (including passing ones): measured wall
      # times, budgets and counters live here, not only on failure.
      - name: Upload CTest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-log-${{ matrix.compiler }}-${{ matrix.build_type }}
          path: build/Testing/Temporary/LastTest.log
          if-no-files-found: warn
          retention-days: 14
